name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --onefile --windowed --name MGTSpritePacker --icon packaging/mgt-sprite-packer.ico --collect-all qdarkstyle main.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/MGTSpritePacker.exe

  linux:
    # Oldest LTS runner: the AppImage runs on distros with glibc >= this one's.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --windowed --name MGTSpritePacker --collect-all qdarkstyle main.py
      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp -r dist/MGTSpritePacker/. AppDir/usr/bin/
          cp packaging/mgt-sprite-packer.desktop packaging/mgt-sprite-packer.png AppDir/
          ln -s usr/bin/MGTSpritePacker AppDir/AppRun
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir MGTSpritePacker-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: MGTSpritePacker-x86_64.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            MGTSpritePacker.exe
            MGTSpritePacker-x86_64.AppImage
